name: jaik
description: "جايك — منصة الخدمات المنزلية: حجز عمال موثوقين، دفع آمن، ووصولات إلكترونية."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  image_picker: ^1.1.2
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  supabase_flutter: ^2.18.3
  sqflite_common_ffi_web: ^1.2.0
  youtube_explode_dart: ^3.1.0
  # شريط تنقل آبل الأصلي (UITabBarController بزجاج Liquid Glass) على iOS 26 وما بعده،
  # وشريط Cupertino على iOS الأقدم. لا كود له على أندرويد.
  uikit_tab_bar: ^0.2.1
  # حركة أيقونة «أعمالنا» في الشريط من ملف Lottie الذي أرسله المستخدم.
  lottie: ^3.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/media/
    - assets/lottie/
  shaders:
    - shaders/liquid_glass.frag
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

# youtube_explode_dart يطلب xml 6، وباقي المشروع (pdf وprinting وimage) يحتاج 7. المكتبة تعمل مع 7.
dependency_overrides:
  xml: ^7.0.1
